<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gibbs Sampler Illustration</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #f4f7fb;
    --muted: #a7b4c8;
    --line: #2c3746;
    --panel: #151923;
    --panel-strong: #0d1118;
    --page: #090c12;
    --region: #23e0ad;
    --x1: #46d8ff;
    --x2: #ff6a3d;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      linear-gradient(115deg, rgba(255, 106, 61, 0.18), transparent 28%),
      linear-gradient(245deg, rgba(70, 216, 255, 0.16), transparent 32%),
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.035) 0, rgba(255, 255, 255, 0.035) 1px, transparent 1px, transparent 72px),
      repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.03) 0, rgba(255, 255, 255, 0.03) 1px, transparent 1px, transparent 72px),
      var(--page);
    color: var(--ink);
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }

  main {
    width: min(1040px, calc(100vw - 32px));
    margin: 0 auto;
    padding: 34px 0 42px;
  }

  h1 {
    margin: 0;
    font-size: clamp(1.8rem, 4vw, 3.1rem);
    line-height: 1;
    text-shadow: 0 0 22px rgba(35, 224, 173, 0.2);
  }

  .subtitle {
    margin: 12px 0 22px;
    color: var(--muted);
    line-height: 1.55;
  }
  .subtitle .k1 { color: var(--x1); font-weight: 700; }
  .subtitle .k2 { color: var(--x2); font-weight: 700; }

  .layout {
    display: grid;
    grid-template-columns: 1fr 320px;
    gap: 18px;
  }

  .plot-wrap, .side {
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 22px 70px rgba(0, 0, 0, 0.35);
  }

  .plot-wrap {
    padding: 18px;
    background:
      linear-gradient(135deg, rgba(70, 216, 255, 0.09), transparent 36%),
      linear-gradient(225deg, rgba(35, 224, 173, 0.11), transparent 42%),
      var(--panel-strong);
  }

  svg { display: block; width: 100%; height: auto; }

  .axis { stroke: #6d7890; stroke-width: 1.2; }
  .tick-label { fill: var(--muted); font-size: 15px; }
  .axis-label { fill: var(--muted); font-size: 18px; font-weight: 700; font-style: italic; }
  .region {
    fill: var(--region);
    fill-opacity: 0.13;
    stroke: var(--region);
    stroke-width: 2.5;
    filter: drop-shadow(0 0 10px rgba(35, 224, 173, 0.55));
  }
  .move { stroke-width: 2.4; stroke-linecap: round; }
  .move.c1 { stroke: var(--x1); filter: drop-shadow(0 0 4px var(--x1)); }
  .move.c2 { stroke: var(--x2); filter: drop-shadow(0 0 4px var(--x2)); }
  .visited { fill: #c9d3e3; fill-opacity: 0.75; }
  .current { fill: #fff; filter: drop-shadow(0 0 8px #fff); }
  .pulse {
    fill: none;
    stroke: #fff;
    stroke-width: 2;
    transform-box: fill-box;
    transform-origin: center;
    animation: pulse 1.6s ease-out infinite;
  }
  @keyframes pulse {
    from { transform: scale(1); opacity: 0.8; }
    to { transform: scale(3.2); opacity: 0; }
  }

  .side {
    display: flex;
    flex-direction: column;
    padding: 18px;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.045), transparent 44%), var(--panel);
  }

  .label { color: var(--muted); font-size: 0.92rem; margin: 0 0 8px; }

  .seg {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    padding: 4px;
    border: 1px solid rgba(167, 180, 200, 0.14);
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.035);
    margin-bottom: 16px;
  }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg label {
    text-align: center;
    padding: 8px 6px;
    border-radius: 6px;
    color: var(--muted);
    cursor: pointer;
    font-weight: 700;
  }
  .seg input:checked + label {
    color: var(--page);
    background: var(--region);
    box-shadow: 0 0 16px rgba(35, 224, 173, 0.45);
  }
  .seg input:focus-visible + label { outline: 2px solid var(--ink); }

  .buttons { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  button {
    font: inherit;
    font-weight: 800;
    padding: 10px 6px;
    border-radius: 8px;
    border: 1px solid rgba(167, 180, 200, 0.25);
    background: rgba(255, 255, 255, 0.05);
    color: var(--ink);
    cursor: pointer;
    transition: transform 0.08s, box-shadow 0.2s;
  }
  button:hover { box-shadow: 0 0 14px rgba(70, 216, 255, 0.35); }
  button:active { transform: scale(0.96); }
  button.primary {
    border: 0;
    color: var(--page);
    background: linear-gradient(90deg, var(--x1), var(--region));
  }

  .tablewrap {
    flex: 1;
    min-height: 220px;
    max-height: 430px;
    overflow-y: auto;
    margin-top: 16px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.028);
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 12px; text-align: right; }
  th { position: sticky; top: 0; background: #1c2230; color: var(--muted); font-weight: 600; }
  td { border-bottom: 1px solid rgba(167, 180, 200, 0.08); }
  td:first-child { color: var(--muted); }
  td.c1 { color: var(--x1); font-weight: 800; }
  td.c2 { color: var(--x2); font-weight: 800; }
  tr.newest { background: rgba(255, 255, 255, 0.08); animation: flash 0.6s ease-out; }
  @keyframes flash { from { background: rgba(35, 224, 173, 0.35); } }

  @media (max-width: 820px) {
    .layout { display: block; }
    .side { margin-top: 16px; }
  }
</style>
</head>
<body>
<main>
  <h1>Gibbs Sampler</h1>
  <p class="subtitle">
    Fixed scan: alternately update <span class="k1">x<sup>(1)</sup></span> and
    <span class="k2">x<sup>(2)</sup></span> by sampling from their full conditionals.
    The target is uniform on the shaded region.
  </p>

  <section class="layout">
    <div class="plot-wrap">
      <svg id="plot" viewBox="0 0 500 500"></svg>
    </div>

    <aside class="side">
      <p class="label">Target</p>
      <div class="seg">
        <input type="radio" name="target" id="t-circle" value="circle" checked><label for="t-circle">Circle</label>
        <input type="radio" name="target" id="t-ellipse" value="ellipse"><label for="t-ellipse">Narrow ellipse</label>
      </div>
      <div class="buttons">
        <button id="step" class="primary">Step</button>
        <button id="run">Run 50</button>
        <button id="reset">Reset</button>
      </div>
      <div class="tablewrap" id="tablewrap">
        <table>
          <thead><tr><th><i>t</i></th><th><i>x</i><sub><i>t</i></sub><sup>(1)</sup></th><th><i>x</i><sub><i>t</i></sub><sup>(2)</sup></th></tr></thead>
          <tbody id="states"></tbody>
        </table>
      </div>
    </aside>
  </section>
</main>

<script>
const SCALE = 180, C = 250;
const px = x => C + SCALE * x;
const py = y => C - SCALE * y;
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('plot');

// Uniform target on {x : x^T A x <= 1}, an ellipse with semi-axis a along y=x and b along y=-x
function makeTarget(a, b) {
  const p = 1 / (a * a), q = 1 / (b * b);
  return { a, b, A: [[(p + q) / 2, (p - q) / 2], [(p - q) / 2, (p + q) / 2]] };
}
const TARGETS = {
  circle:  { ...makeTarget(1, 1),   start: [0, 0] },
  ellipse: { ...makeTarget(1, 0.1), start: [-0.6, -0.6] },
};

// Full conditional of x(i) given the other component c is uniform on [lo, hi]
function conditional(A, i, c) {
  const j = 1 - i;
  const aii = A[i][i], aij = A[i][j], ajj = A[j][j];
  const disc = Math.sqrt(Math.max(0, aij * aij * c * c - aii * (ajj * c * c - 1)));
  return [(-aij * c - disc) / aii, (-aij * c + disc) / aii];
}

let target, x, t, i, layer, marker, pulse, anim;

function el(tag, attrs, parent = layer) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  parent.appendChild(e);
  return e;
}

const fmt = v => v.toFixed(3);

function drawAxes() {
  svg.innerHTML = '';
  const g = document.createElementNS(NS, 'g');
  svg.appendChild(g);
  el('line', { class: 'axis', x1: 10, y1: C, x2: 490, y2: C }, g);
  el('line', { class: 'axis', x1: C, y1: 10, x2: C, y2: 490 }, g);
  el('ellipse', {
    class: 'region', cx: C, cy: C, rx: SCALE * target.a, ry: SCALE * target.b,
    transform: `rotate(-45 ${C} ${C})`,
  }, g);
  for (const v of [-1, 1]) {
    el('line', { class: 'axis', x1: px(v), y1: C - 5, x2: px(v), y2: C + 5 }, g);
    el('line', { class: 'axis', x1: C - 5, y1: py(v), x2: C + 5, y2: py(v) }, g);
    el('text', { class: 'tick-label', x: px(v) + (v > 0 ? 8 : -8), y: C + 20, 'text-anchor': v > 0 ? 'start' : 'end' }, g).textContent = v;
    el('text', { class: 'tick-label', x: C - 10, y: py(v) + (v > 0 ? -6 : 16), 'text-anchor': 'end' }, g).textContent = v;
  }
  el('text', { class: 'axis-label', x: 490, y: C - 10, 'text-anchor': 'end' }, g).innerHTML = 'x<tspan dy="-7" font-size="12">(1)</tspan>';
  el('text', { class: 'axis-label', x: C + 10, y: 26 }, g).innerHTML = 'x<tspan dy="-7" font-size="12">(2)</tspan>';
  layer = document.createElementNS(NS, 'g');
  svg.appendChild(layer);
  pulse = el('circle', { class: 'pulse', r: 6 });
  marker = el('circle', { class: 'current', r: 6 });
}

function addRow(changed) {
  const tbody = document.getElementById('states');
  const prev = tbody.querySelector('.newest');
  if (prev) prev.classList.remove('newest');
  const tr = document.createElement('tr');
  tr.className = 'newest';
  tr.innerHTML = `<td>${t}</td><td class="${changed === 0 ? 'c1' : ''}">${fmt(x[0])}</td>` +
                 `<td class="${changed === 1 ? 'c2' : ''}">${fmt(x[1])}</td>`;
  tbody.appendChild(tr);
  const wrap = document.getElementById('tablewrap');
  wrap.scrollTop = wrap.scrollHeight;
}

function placeMarker(p) {
  for (const m of [marker, pulse]) {
    m.setAttribute('cx', px(p[0]));
    m.setAttribute('cy', py(p[1]));
    layer.appendChild(m);  // keep on top
  }
}

function finishAnimation() {
  if (anim) { cancelAnimationFrame(anim.id); anim.done(); anim = null; }
}

function reset() {
  finishAnimation();
  target = TARGETS[document.querySelector('input[name=target]:checked').value];
  x = target.start.slice();
  t = 1; i = 0;
  drawAxes();
  document.getElementById('states').innerHTML = '';
  addRow(-1);
  placeMarker(x);
}

// One update: sample x(i) from its full conditional, move, record x_{t+1}
function update(animate) {
  finishAnimation();
  const [lo, hi] = conditional(target.A, i, x[1 - i]);
  const old = x.slice();
  x[i] = lo + (hi - lo) * Math.random();
  t += 1;
  const end = x.slice();
  el('circle', { class: 'visited', cx: px(old[0]), cy: py(old[1]), r: 3 });
  const line = el('line', { class: `move c${i + 1}`, x1: px(old[0]), y1: py(old[1]), x2: px(old[0]), y2: py(old[1]) });
  const done = () => {
    line.setAttribute('x2', px(end[0]));
    line.setAttribute('y2', py(end[1]));
    placeMarker(end);
  };
  addRow(i);
  i = 1 - i;
  if (!animate) { done(); return; }

  // Slide the point along the move, easing out
  const t0 = performance.now(), dur = 450;
  anim = { done };
  const frame = now => {
    const s = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - s, 3);
    const p = [old[0] + e * (end[0] - old[0]), old[1] + e * (end[1] - old[1])];
    line.setAttribute('x2', px(p[0]));
    line.setAttribute('y2', py(p[1]));
    placeMarker(p);
    if (s < 1) anim.id = requestAnimationFrame(frame);
    else anim = null;
  };
  anim.id = requestAnimationFrame(frame);
}

document.getElementById('step').onclick = () => update(true);
document.getElementById('run').onclick = () => { for (let k = 0; k < 50; k++) update(false); };
document.getElementById('reset').onclick = reset;
document.querySelectorAll('input[name=target]').forEach(r => r.onchange = reset);
reset();
</script>
</body>
</html>
